<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图序双端等高截图预览</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  .gallery { display: inline-flex; gap: 24px; padding: 16px; border: 1px solid #d1d9e0; border-radius: 8px; background: #f6f8fa; }
  .platform { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .label { color: #1f2328; font-size: 14px; line-height: 20px; font-weight: 600; }
  img { display: block; height: 300px; width: auto; }
</style>
<main class="gallery">
  <section class="platform"><span class="label">Windows</span><img src="windows-reader.png" alt="图序 Windows 阅读界面"></section>
  <section class="platform"><span class="label">Android</span><img src="android-reader.jpg" alt="图序 Android 阅读界面"></section>
</main>
</html>
